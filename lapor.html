<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulir Lapor Cepat — TemuIn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">
      <span class="logo-icon" aria-hidden="true">🧭</span>
      <span class="logo-text">TemuIn</span>
    </a>
    <div class="nav-actions">
      <button type="button" class="profile-btn" aria-label="Profil pengguna">👤</button>
    </div>
  </header>

  <main>
    <section class="page-container">
      <a href="index.html">&larr; Kembali</a>
      <h1 style="margin-top: 12px; margin-bottom: 20px;">Formulir Lapor Cepat</h1>

      <div class="card-panel">
        <div class="form-tabs">
          <button type="button" class="active" id="tab-menemukan">Menemukan</button>
          <button type="button" id="tab-kehilangan">Kehilangan</button>
        </div>

        <form id="form-lapor" action="#" method="POST" novalidate>
          <div class="form-group">
            <label for="nama-barang">Nama Barang *</label>
            <input type="text" id="nama-barang" name="namaBarang" placeholder="Misal: Dompet Hitam Kulit" required minlength="3"/>
          </div>

          <div class="form-group">
            <label for="email-pelapor">Email Pelapor *</label>
            <input type="email" id="email-pelapor" name="emailPelapor" placeholder="contoh: user@student.upi.edu" required />
          </div>

          <div class="form-group">
            <label for="kategori">Kategori</label>
            <select id="kategori" name="kategoriBarang" required>
              <option value="" disabled selected>Pilih Kategori</option>
              <option value="Aksesoris">Aksesoris</option>
              <option value="Elektronik">Elektronik</option>
              <option value="Dompet">Dompet</option>
              <option value="Dokumen">Dokumen</option>
            </select>
          </div>

          <div class="form-group">
            <label for="lokasi-gedung">Lokasi Gedung *</label>
            <select id="lokasi-gedung" name="lokasiGedung" required>
              <option value="" disabled selected>Pilih Gedung</option>
              <option value="Perpustakaan Pusat">Perpustakaan Pusat</option>
              <option value="Auditorium">Auditorium</option>
              <option value="Kantin Utama">Kantin Utama</option>
              <option value="Lab Komputer">Lab Komputer</option>
            </select>
          </div>

          <div class="form-group">
            <label for="deskripsi-barang">Deskripsi Tambahan</label>
            <textarea 
              id="deskripsi-barang" 
              name="deskripsiBarang" 
              rows="3" 
              placeholder="Jelaskan ciri khusus atau kondisi fisik barang..." 
            ></textarea>
          </div>

          <div class="form-group card-panel" id="panel-kuis" style="background-color: var(--bg);">
            <label>Pengaturan Kuis Verifikasi</label>
            <p class="muted" style="margin-bottom: 12px;">
              Buat satu pertanyaan rahasia yang hanya diketahui pemilik aslinya untuk mencegah klaim palsu.
            </p>
            <div class="form-group">
              <label for="pertanyaan-kuis">Pertanyaan Kuis *</label>
              <input type="text" id="pertanyaan-kuis" name="pertanyaanKuis" placeholder="Cth: Apa warna dompet bagian dalam?" required minlength="5"/>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label for="jawaban-benar">Jawaban yang Benar *</label>
              <input type="text" id="jawaban-benar" name="jawabanBenar" placeholder="Cth: Merah" required/>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; text-align: center;">Kirim Laporan</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-brand">
      <span class="logo-icon" aria-hidden="true">🧭</span> TemuIn
    </div>
    <p class="copyright">&copy; 2026 TemuIn. Semua hak dilindungi.</p>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/form-validation.js"></script>
</body>
</html>
