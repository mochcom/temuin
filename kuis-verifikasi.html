<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuis Verifikasi Kepemilikan — TemuIn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">
      <span class="logo-icon" aria-hidden="true">🧭</span>
      <span class="logo-text">TemuIn</span>
    </a>
    <div class="nav-actions">
      <button type="button" class="profile-btn" aria-label="Profil pengguna">👤</button>
    </div>
  </header>

  <!--
    Catatan tim: halaman ini adalah kerangka dasar untuk Modul Kuis
    Verifikasi Kepemilikan (fitur MVP #3 dari Progress 1).
    Interaktivitas (submit jawaban, cek ke backend, tampilkan pesan
    error/berhasil) akan dikerjakan bersamaan dengan JavaScript di
    js/modal-kuis.js dan endpoint POST /api/claim/verify pada Materi
    lanjutan. Styling overlay/modal sudah disiapkan di css/modal.css.
  -->
  <main class="page-container" style="max-width: 480px;">
    <div class="card-panel">
      <h1 style="margin-bottom: 8px;">Kuis Verifikasi</h1>
      <p class="muted" style="margin-bottom: 20px;">
        Jawab pertanyaan rahasia untuk membuktikan barang ini benar milikmu.
      </p>

      <form id="form-kuis-verifikasi">
        <div class="form-group">
          <label for="pertanyaan">Apa warna dompet bagian dalam?</label>
          <input type="text" id="pertanyaan" placeholder="Tulis jawabanmu di sini" required>
        </div>
        <button type="submit" class="btn" style="width: 100%; text-align: center;">Kirim Jawaban</button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-brand">
      <span class="logo-icon" aria-hidden="true">🧭</span> TemuIn
    </div>
    <p class="copyright">&copy; 2026 TemuIn. Semua hak dilindungi.</p>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/modal-kuis.js"></script>
</body>
</html>
